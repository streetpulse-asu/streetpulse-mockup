<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>StreetPulse Mockup 5: Minimalist Floating Card</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Literata:ital,opsz,wght@0,7..72,600;0,7..72,700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/tokens.css?v=v17">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        body {
            background: #0f172a;
            font-family: 'Plus Jakarta Sans', sans-serif;
            color: #16233d;
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh;
        }
        .phone-frame {
            width: 412px; height: 890px;
            background: #fffdf9;
            position: relative; overflow: hidden;
            display: flex; flex-direction: column;
            border-radius: 40px;
            box-shadow: 0 25px 60px rgba(0,0,0,0.4), 0 0 0 10px #1e293b;
        }
        #map { width: 100%; height: 100%; position: absolute; top: 0; left: 0; z-index: 1; }

        /* Top Floating Capsule */
        .top-capsule-bar {
            position: absolute; top: 16px; left: 16px; right: 16px;
            z-index: 800; height: 50px;
            background: rgba(255, 255, 255, 0.95);
            border: 1px solid rgba(15, 23, 42, 0.12);
            border-radius: 25px;
            display: flex; align-items: center; justify-content: space-between;
            padding: 0 16px;
            box-shadow: 0 4px 16px rgba(15, 23, 42, 0.08);
            backdrop-filter: blur(8px);
        }
        .capsule-brand {
            display: flex; align-items: center; gap: 8px;
            font-size: 0.9rem; font-weight: 800; color: #16233d;
        }
        .capsule-brand img { width: 22px; height: 22px; }
        .capsule-tools { display: flex; align-items: center; gap: 6px; }
        .tool-btn {
            width: 36px; height: 36px; border-radius: 50%;
            background: #f1f5f9; border: 1px solid #e2e8f0;
            display: flex; align-items: center; justify-content: center;
            color: #16233d; cursor: pointer;
        }
        .tool-btn.active {
            background: #0f6e6a; color: #fff; border-color: #0f6e6a;
        }

        /* Bottom-Left Zoom Capsule */
        .bottom-left-zoom {
            position: absolute; left: 16px; bottom: 270px; z-index: 800;
            background: rgba(255, 255, 255, 0.95);
            border: 1px solid rgba(15, 23, 42, 0.12);
            border-radius: 20px; overflow: hidden;
            box-shadow: 0 4px 12px rgba(15, 23, 42, 0.1);
            display: flex; flex-direction: column;
        }
        .zoom-touch {
            width: 40px; height: 40px; background: none; border: none;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.2rem; font-weight: 700; color: #16233d; cursor: pointer;
        }

        /* Bottom-Right Locate FAB */
        .bottom-right-locate {
            position: absolute; right: 16px; bottom: 270px; z-index: 800;
        }
        .locate-round {
            width: 44px; height: 44px; border-radius: 50%;
            background: rgba(255, 255, 255, 0.95);
            border: 1px solid rgba(15, 23, 42, 0.12);
            display: flex; align-items: center; justify-content: center;
            color: #2563eb; cursor: pointer;
            box-shadow: 0 4px 14px rgba(15, 23, 42, 0.1);
        }

        /* Floating Selected Site Card */
        .floating-site-card {
            position: absolute; bottom: 84px; left: 14px; right: 14px;
            z-index: 900;
            background: #ffffff;
            border: 1px solid rgba(15, 23, 42, 0.12);
            border-radius: 20px; padding: 16px 18px;
            box-shadow: 0 10px 30px rgba(15, 23, 42, 0.14);
            display: flex; flex-direction: column; gap: 10px;
        }
        .fsc-header {
            display: flex; justify-content: space-between; align-items: flex-start;
        }
        .badge-row { display: flex; gap: 6px; }
        .fsc-badge {
            font-size: 0.64rem; font-weight: 700; text-transform: uppercase;
            padding: 3px 8px; border-radius: 6px; letter-spacing: 0.5px;
        }
        .badge-cool { background: #e0f2fe; color: #0369a1; }
        .fsc-dist-badge {
            font-size: 0.78rem; font-weight: 700; color: #0f6e6a;
            background: #e6f4f3; padding: 3px 8px; border-radius: 8px;
        }
        .fsc-title {
            font-family: 'Literata', serif; font-size: 1.12rem; font-weight: 700;
            color: #16233d; line-height: 1.25; margin-top: 4px;
        }
        .fsc-addr { font-size: 0.78rem; color: #64748b; margin-top: 2px; }
        .fsc-status-line {
            display: flex; align-items: center; gap: 8px; font-size: 0.76rem; font-weight: 600;
        }
        .status-dot-open {
            width: 7px; height: 7px; border-radius: 50%; background: #22c55e;
        }

        .fsc-actions {
            display: grid; grid-template-columns: 2fr 1fr; gap: 8px; margin-top: 4px;
        }
        .btn-fsc-walk {
            height: 42px; background: #0f6e6a; color: #fff;
            border: none; border-radius: 12px; font-size: 0.84rem; font-weight: 700;
            display: flex; align-items: center; justify-content: center; gap: 6px;
            cursor: pointer; box-shadow: 0 2px 8px rgba(15, 110, 106, 0.25);
        }
        .btn-fsc-call {
            height: 42px; background: #f1f5f9; color: #16233d;
            border: 1px solid #e2e8f0; border-radius: 12px; font-size: 0.84rem; font-weight: 700;
            display: flex; align-items: center; justify-content: center; gap: 6px;
            cursor: pointer;
        }

        /* Floating Pill Nav */
        .floating-pill-nav {
            position: absolute; bottom: 18px; left: 50%; transform: translateX(-50%);
            z-index: 950; height: 48px;
            background: rgba(22, 35, 61, 0.94);
            backdrop-filter: blur(10px);
            border-radius: 24px; padding: 4px 10px;
            display: flex; align-items: center; gap: 4px;
            box-shadow: 0 6px 20px rgba(0,0,0,0.25);
        }
        .dock-pill-item {
            display: flex; align-items: center; gap: 6px;
            padding: 6px 14px; border-radius: 18px;
            font-size: 0.75rem; font-weight: 700; color: #94a3b8;
            cursor: pointer; transition: all 0.15s;
        }
        .dock-pill-item.active {
            background: rgba(255, 255, 255, 0.15);
            color: #fff;
        }
        .dock-pill-item svg { width: 16px; height: 16px; }

        /* Cluster Bubble */
        .hrn-cluster div {
            background: rgba(255,253,249,0.125);
            border: 2px solid rgba(120,108,88,0.52);
            color: #16233d; border-radius: 50%; text-align: center;
            font-weight: 800; font-size: 0.74rem;
            box-shadow: 0 2px 8px rgba(22,35,61,0.18);
        }
    </style>
</head>
<body>

<div class="phone-frame">
    <div id="map"></div>

    <!-- Top Floating Capsule -->
    <div class="top-capsule-bar">
        <div class="capsule-brand">
            <img src="assets/streetpulse_mark.svg" alt="StreetPulse">
            <span>StreetPulse</span>
        </div>
        <div class="capsule-tools">
            <button class="tool-btn" title="Search Sites">
                <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
            </button>
            <button class="tool-btn active" title="Filters (2 Active)">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"></polygon></svg>
            </button>
        </div>
    </div>

    <!-- Bottom-Left Zoom -->
    <div class="bottom-left-zoom">
        <button class="zoom-touch" onclick="map.zoomIn()">+</button>
        <div style="height:1px;background:#e2e8f0;"></div>
        <button class="zoom-touch" onclick="map.zoomOut()">−</button>
    </div>

    <!-- Bottom-Right Locate -->
    <div class="bottom-right-locate">
        <button class="locate-round" title="Locate Me">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
                <polygon points="3 11 22 2 13 21 11 13 3 11"></polygon>
            </svg>
        </button>
    </div>

    <!-- Floating Selected Site Card -->
    <div class="floating-site-card">
        <div class="fsc-header">
            <div class="badge-row">
                <span class="fsc-badge badge-cool">Cooling Center</span>
            </div>
            <div class="fsc-dist-badge">🚶 7 min walk (0.3 mi)</div>
        </div>
        <div>
            <div class="fsc-title">Burton Barr Central Library</div>
            <div class="fsc-addr">1221 N. Central Ave · Phoenix, AZ</div>
        </div>
        <div class="fsc-status-line">
            <div class="status-dot-open"></div>
            <span style="color:#15803d;">Open until 8:00 PM</span>
            <span style="color:#64748b;">· A/C, Hydration, Restrooms</span>
        </div>
        <div class="fsc-actions">
            <button class="btn-fsc-walk">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
                    <circle cx="13" cy="4" r="2"/><path d="m9 21 1.5-6.5L8 12l1-5 3.5 2 3 1.5"/><path d="M14.5 14.5 17 21"/>
                </svg>
                Walk There
            </button>
            <button class="btn-fsc-call">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
                    <path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.4 2.1L8.1 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.7 2z"/>
                </svg>
                Call
            </button>
        </div>
    </div>

    <!-- Floating Pill Nav -->
    <nav class="floating-pill-nav">
        <div class="dock-pill-item active">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><polygon points="1 6 1 22 8 18 16 22 23 18 23 2 16 6 8 2 1 6"></polygon><line x1="8" y1="2" x2="8" y2="18"></line><line x1="16" y1="6" x2="16" y2="22"></line></svg>
            <span>Map</span>
        </div>
        <div class="dock-pill-item">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M22 12h-4l-3 9L9 3l-3 9H2"></path></svg>
            <span>Scan</span>
        </div>
        <div class="dock-pill-item">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1-2.5-2.5Z"></path><path d="M6 6h10"></path><path d="M6 10h10"></path></svg>
            <span>Guide</span>
        </div>
    </nav>
</div>

<script>
    const map = L.map('map', {
        center: [33.4560, -112.0740],
        zoom: 14.5,
        zoomControl: false,
        attributionControl: false
    });

    L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Light_Gray_Base/MapServer/tile/{z}/{y}/{x}', {
        maxZoom: 16, minZoom: 9
    }).addTo(map);
    L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Light_Gray_Reference/MapServer/tile/{z}/{y}/{x}', {
        maxZoom: 16, minZoom: 9
    }).addTo(map);

    map.getPane('tilePane').style.filter = 'hue-rotate(195deg) saturate(0.55) brightness(0.97) contrast(1.04)';

    function makePin(col, iconSvg) {
        const shape = `<svg xmlns="http://www.w3.org/2000/svg" width="36" height="44" viewBox="0 0 36 44">
            <path d="M18 1 C9.163 1 2 8.163 2 17 C2 26.5 10 35 18 43 C26 35 34 26.5 34 17 C34 8.163 26.837 1 18 1Z"
                  fill="${col}" stroke="rgba(0,0,0,0.12)" stroke-width="0.8"/>
            <circle cx="18" cy="16" r="10" fill="white"/>
            <g transform="translate(18,16)">${iconSvg}</g>
        </svg>`;
        return L.divIcon({
            className: 'hrn-pin', iconSize: [36, 44], iconAnchor: [18, 44],
            html: `<div style="width:36px;height:44px;filter:drop-shadow(0 3px 6px rgba(0,0,0,0.28))">${shape}</div>`
        });
    }

    const icons = {
        cool: '<path d="M0 -5.6V5.6M-4.8 -2.8L4.8 2.8M-4.8 2.8L4.8 -2.8" fill="none" stroke="#64b5f6" stroke-width="1.6" stroke-linecap="round"/>',
        hydr: '<path d="M0 -5.4C3.6 -1.5 4.7 0.7 4.7 2.4A4.7 4.7 0 0 1 -4.7 2.4C-4.7 0.7 -3.6 -1.5 0 -5.4Z" fill="none" stroke="#0288d1" stroke-width="1.6" stroke-linejoin="round"/>',
        resp: '<path d="M-5.2 2.4V-1.4A1.8 1.8 0 0 1 -3.4 -3.2H3.4A1.8 1.8 0 0 1 5.2 -1.4V2.4M-5.2 2.4H5.2M-5.2 2.4V4M5.2 2.4V4" fill="none" stroke="#e53935" stroke-width="1.5" stroke-linecap="round"/>',
        coll: '<path d="M-4.6 -2.2H4.6V4.4H-4.6ZM-4.6 -2.2L-3 -4.6H3L4.6 -2.2M0 -2.2V4.4" fill="none" stroke="#2e7d32" stroke-width="1.4" stroke-linecap="round"/>'
    };

    L.marker([33.4560, -112.0740], { icon: makePin('#64b5f6', icons.cool) }).addTo(map);
    L.marker([33.4480, -112.0810], { icon: makePin('#e53935', icons.resp) }).addTo(map);
    L.marker([33.4620, -112.0680], { icon: makePin('#0288d1', icons.hydr) }).addTo(map);

    const clusterDiv = L.divIcon({
        className: 'hrn-cluster', iconSize: [36, 36],
        html: '<div style="width:36px;height:36px;line-height:36px;">9</div>'
    });
    L.marker([33.4510, -112.0620], { icon: clusterDiv }).addTo(map);
</script>
</body>
</html>
